name: linknest
description: "LinkNest - Your Private Knowledge Vault. Securely store links, documents, and notes offline."
publish_to: 'none'
version: 1.0.0+1
author: Rolan Lobo <RNR>

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.1
  path: ^1.9.0
  uuid: ^4.3.3
  share_plus: ^10.0.2
  url_launcher: ^6.2.5
  file_picker: ^8.0.0+1
  open_file: ^3.3.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  flutter_markdown: ^0.6.20
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  home_widget: ^0.6.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/LN.png"
  # Disable adaptive icons to prevent cutoff - using standard icon instead
  adaptive_icon_background: "#2196F3"
